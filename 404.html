  anim.addEventListener('DOMLoaded', function () {
    var svg = document.querySelector('#anim svg');
    var TEXT = 'リンクが開けませんでした。';
    var beamLayer = anim.renderer.elements[3].layerElement; // ライト（光の帯）のレイヤー
    var beamD = beamLayer.querySelector('path').getAttribute('d');

    function el(name, attrs) {
      var e = document.createElementNS(NS, name);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }

    // 光が当たっている範囲だけを白くするためのマスク
    var defs = el('defs', {});
    var mask = el('mask', { id: 'beamMask', maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: 1600, height: 1300 });
    var beam = el('path', { d: beamD, fill: '#fff' });
    mask.appendChild(beam);
    defs.appendChild(mask);
    svg.appendChild(defs);

    var common = { x: 800, y: 905, 'text-anchor': 'middle', 'class': 'msg', 'font-size': 76 };
    var dark = el('text', common);  dark.setAttribute('fill', '#002b2b'); dark.textContent = TEXT;
    var white = el('text', common); white.setAttribute('fill', '#fff'); white.setAttribute('mask', 'url(#beamMask)'); white.textContent = TEXT;
    svg.appendChild(dark);
    svg.appendChild(white);

    // ライトの動きに合わせてマスクを動かす
    function sync() { beam.setAttribute('transform', beamLayer.getAttribute('transform') || ''); }
    anim.addEventListener('enterFrame', sync);
    sync();
  });
